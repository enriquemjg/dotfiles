"$schema" = 'https://starship.rs/config-schema.json'

palette = 'catppuccin_mocha'

format = """\
[](fg:pink)[$os](bg:pink fg:crust)[](fg:pink) \
[](fg:mauve)[](bg:mauve fg:crust)[](fg:mauve)$directory\
$git_branch$git_status[ ](bold)\
$fill\
$time\
$username\
$line_break$character"""

[os]
disabled = false
format = '$symbol'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[fill]
symbol = "─"
style = "fg:overlay0"

[directory]
format = '[ $path]($style)'
truncation_length = 3
style = ''

[git_branch]
format = ' [](fg:green)[](bg:green fg:crust)[](fg:green)[ $branch]($style)'
style = ''

[git_status]
format = '$all_status$ahead_behind'

[time]
disabled = false
format = '[](fg:lavender)[](bg:lavender fg:crust)[](fg:lavender)[ $time]($style) '
style = ''
time_format = "%H:%M"

[username]
show_always = true
format = '[](fg:yellow)[](bg:yellow fg:crust)[](fg:yellow)[ $user]($style) '
style_user = ''
style_root = ''

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'

[palettes.catppuccin_mocha]
pink = "#f5c2e7"
mauve = "#cba6f7"
green = "#a6e3a1"
sky = "#89dceb"
lavender = "#b4befe"
crust = "#11111b"
surface0 = "#313244"
overlay0 = "#6c7086"
yellow = "#f9e2af"
